[package]
name = "lf"
description = "A tool for fitting lattice data."
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/supertrianguloid/lf"

[dependencies]
approx = "0.5.1"
clap = { version = "4.5.51", features = ["derive"] }
clap_complete = "4.5.60"
clap_complete_nushell = "4.5.9"
nalgebra = "0.33.2"
rand = "0.10.0-rc.0"
rand_distr = "0.6.0-rc.0"
rayon = "1.10.0"
roots = "0.0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
statrs = "0.18.0"
varpro = "0.13.3"
